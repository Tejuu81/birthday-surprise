<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#020111,#000);
    color:white;
    text-align:center;
}

h1{
    margin-top:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
    transition:0.4s;
    box-shadow:0 0 15px rgba(255,255,255,.3);
}

.gallery img:hover{
    transform:scale(1.05);
}

.btn{
    padding:15px 35px;
    margin:30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

</style>
</head>
<body>

<h1>📸 Our ❤️  Memories 📸</h1>

<div class="gallery">

<img src="photo1.jpg" alt="Photo 1">
<img src="photo2.jpg" alt="Photo 2">
<img src="photo3.jpg" alt="Photo 3">
<img src="photo4.jpg" alt="Photo 4">
<img src="photo5.jpg" alt="Photo 5">
<img src="photo6.jpg" alt="Photo 6">
<img src="photo7.jpg" alt="Photo 7">
<img src="photo8.jpg" alt="Photo 8">
<img src="photo9.jpg" alt="Photo 9">
<img src="photo10.jpg" alt="Photo 10">



</div>

<a href="surprise.html">
<button class="btn"> <love class="html"></love> ❤️</button>
</a>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="Pehla_Pyaar.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

music.addEventListener("loadedmetadata", () => {
    const savedTime = localStorage.getItem("musicTime");
    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }
});

setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 1000);
</script>
</body>

</body>
</html>
