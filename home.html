<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapil ❤️ Tejuu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(to bottom,#020111,#191621,#000);
    color:white;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;}
    to{opacity:1;}
}

.moon{
    width:150px;
    height:150px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 50px #fff;
    margin-bottom:30px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    font-size:4rem;
    text-shadow:0 0 20px #ff69b4;
    animation:fadeIn 3s ease;
}

p{
    margin-top:15px;
    font-size:1.2rem;
    text-align:center;
    animation:fadeIn 4s ease;
}

.btn{
    margin-top:40px;
    padding:15px 40px;
    border:none;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.2);
    transition:.4s;
}

.btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px pink;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="moon"></div>

<h1>Kapil ❤️ Tejuu</h1>

<p>
Every beautiful story begins with a memory...<br>
Welcome to our magical journey.
</p>



<button class="btn" onclick="startMusic()">
🚪 Enter My Memories
</button>

<script>
function startMusic() {

    const music = document.getElementById("bgMusic");

    if(music){
        music.play();
    }

    setTimeout(() => {
        window.location.href = "door.html";
    }, 500);

}
</script>


<audio id="bgMusic" autoplay loop>
    <source src="music/Pehla_Pyaar.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

music.addEventListener("loadedmetadata", () => {

    const savedTime = localStorage.getItem("musicTime");

    if(savedTime){
        music.currentTime = parseFloat(savedTime);
    }

    music.play().catch(() => {});
});

music.addEventListener("timeupdate", () => {

    localStorage.setItem("musicTime", music.currentTime);

});
</script>



</body>
</html>
