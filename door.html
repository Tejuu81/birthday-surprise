<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapil ❤️ Tejuu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:url("images/radha.jpg") center center/cover no-repeat;
}


.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
    z-index:1;
}

/* Doors */

.container{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    z-index:5;
}

.door{
    width:50%;
    height:100%;
    position:relative;
    transition:2.5s ease;
    overflow:hidden;

    background:
    linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.15)),
    linear-gradient(90deg,#5b3317,#7b4019,#9d5c27,#7b4019,#5b3317);

    border:5px solid gold;
    box-shadow:inset 0 0 30px rgba(0,0,0,.5);
}

.left{
    transform-origin:left;
}

.right{
    transform-origin:right;
}

.open .left{
    transform:perspective(1400px) rotateY(-105deg);
}

.open .right{
    transform:perspective(1400px) rotateY(105deg);
}

/* Door Decoration */

.frame{
    position:absolute;
    top:40px;
    left:40px;
    right:40px;
    bottom:40px;
    border:4px solid gold;
}

.frame::before{
    content:"";
    position:absolute;
    inset:18px;
    border:2px solid rgba(255,215,0,.5);
}

/* Handles */

.handle{
    position:absolute;
    width:16px;
    height:90px;
    background:gold;
    border-radius:12px;
    top:50%;
    transform:translateY(-50%);
    box-shadow:0 0 15px gold;
}

.left .handle{
    right:30px;
}

.right .handle{
    left:30px;
}

/* Text */

.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:10;
    width:90%;
}

.content h1{
    font-size:60px;
    text-shadow:0 0 20px hotpink;
}

.content h2{
    margin-top:10px;
    font-size:28px;
}

.content p{
    margin-top:20px;
    font-size:20px;
}

/* Button */

button{
    margin-top:35px;
    padding:15px 45px;
    font-size:20px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#ff4081,#ff80ab);
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

/* Responsive */

@media(max-width:768px){

.content h1{
    font-size:38px;
}

.content h2{
    font-size:22px;
}

.content p{
    font-size:17px;
}

button{
    font-size:17px;
    padding:12px 30px;
}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="content">

<h1>Kapil ❤️ Tejuu</h1>

<h2>Welcome To Our Beautiful Memories</h2>

<p>
Every beautiful story begins with one magical door... ✨
</p>

<button onclick="openDoor()">
Open Our Memories 🚪
</button>

</div>

<div class="container" id="doors">

<div class="door left">

<div class="frame"></div>

<div class="handle"></div>

</div>

<div class="door right">

<div class="frame"></div>

<div class="handle"></div>

</div>

</div>

<script>

function openDoor(){

document.getElementById("doors").classList.add("open");

setTimeout(function(){

window.location.href="welcome.html";

},2500);

}

</script>

</script>
</style>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="music/Pehla_Pyaar.mp3" type="audio/mpeg">
</audio>

<!-- Your door page content starts here -->

<script>
const music = document.getElementById("bgMusic");

music.addEventListener("loadedmetadata", () => {
    const savedTime = localStorage.getItem("musicTime");
    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }
});

setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 1000);


</script>
</body>



</body>
</html>
