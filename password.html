<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff5f9e,#ff89b5,#ffd6e8);
    overflow:hidden;
}

.box{
    width:400px;
    padding:40px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    border-radius:20px;
    text-align:center;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:20px;
}

p{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin:20px 0;
    outline:none;
}

button{
    padding:15px 35px;
    border:none;
    background:#ff0066;
    color:white;
    font-size:18px;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff3385;
}

#error{
    margin-top:20px;
    color:yellow;
    font-weight:bold;
}

#bgMusic{
    position:fixed;
    top:15px;
    right:15px;
    width:250px;
}

</style>

</head>

<body>

<div class="box">

    <h1>❤️ Secret Surprise ❤️</h1>

    <p>This surprise is only for Kapil 💖</p>

    <input
        type="password"
        id="pass"
        placeholder="Enter Password">

    <button onclick="check()">
        Unlock ❤️
    </button>

    <p id="error"></p>

</div>

<audio id="bgMusic" controls loop>
    <source src="music/Pehla_Pyaar.mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio>

<script>

function check(){

    let password = document.getElementById("pass").value.trim();

    if(password === "KAPIL"){

        window.location.href = "index.html";

    }else{

        document.getElementById("error").innerHTML =
        "❤️ Wrong Password ❤️";

    }

}

</script>

</body>
</html>
